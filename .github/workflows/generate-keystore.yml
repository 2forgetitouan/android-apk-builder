name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias'
        required: true
        default: 'my-key-alias'
      keystore_password:
        description: 'Keystore password'
        required: true
      key_password:
        description: 'Key password'
        required: true
      dname:
        description: 'Distinguished Name (ex: CN=John Doe, O=MyApp, C=FR)'
        required: true
        default: 'CN=Unknown, O=Unknown, C=US'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Generate keystore
      run: |
        keytool -genkey -v \
          -keystore keystore.jks \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias "${{ github.event.inputs.key_alias }}" \
          -storepass "${{ github.event.inputs.keystore_password }}" \
          -keypass "${{ github.event.inputs.key_password }}" \
          -dname "${{ github.event.inputs.dname }}"

    - name: Display base64 keystore
      run: |
        echo "## Keystore generated" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Copy the value below and add it as a secret named \`KEYSTORE_BASE64\`:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        base64 -w 0 keystore.jks >> $GITHUB_STEP_SUMMARY
        echo '' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Also add these secrets:" >> $GITHUB_STEP_SUMMARY
        echo "- \`KEYSTORE_PASSWORD\` : the keystore password you entered" >> $GITHUB_STEP_SUMMARY
        echo "- \`KEY_ALIAS\` : \`${{ github.event.inputs.key_alias }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`KEY_PASSWORD\` : the key password you entered" >> $GITHUB_STEP_SUMMARY
