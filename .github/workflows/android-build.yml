name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate app zip
      run: |
        count=$(find app -maxdepth 1 -type f 2>/dev/null | wc -l)
        if [ "$count" -eq 0 ]; then
          echo "::error::No file found in app/"
          exit 1
        fi
        if [ "$count" -gt 1 ]; then
          echo "::error::Multiple files found in app/ — only one .zip is allowed"
          exit 1
        fi
        file=$(find app -maxdepth 1 -type f)
        if [[ "$file" != *.zip ]]; then
          echo "::error::File '$file' is not a .zip archive"
          exit 1
        fi
        echo "APP_ZIP=$file" >> $GITHUB_ENV

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease

    - name: Download uber-apk-signer
      run: |
        curl -L https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar \
          -o uber-apk-signer.jar

    - name: Decode keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

    - name: Sign Release APK
      run: |
        java -jar uber-apk-signer.jar \
          --apks app/build/outputs/apk/release/ \
          --ks keystore.jks \
          --ksAlias "${{ secrets.KEY_ALIAS }}" \
          --ksPass "${{ secrets.KEYSTORE_PASSWORD }}" \
          --ksKeyPass "${{ secrets.KEY_PASSWORD }}" \
          --out app/build/outputs/apk/release/signed \
          --overwrite

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK (signed)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: app/build/outputs/apk/release/signed/*.apk

    - name: Upload Build Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports
        path: app/build/reports/
        if-no-files-found: ignore
